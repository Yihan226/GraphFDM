general:
  name: molecule_pt
  wandb: disabled
  wandb_project: graphfdm
  gpus: 1
  resume: null
  test_only: null
  train_method: pt_unconditional
  validation_sampling: false
  test_after_fit: false
  sample_every_val: 15
  samples_to_generate: 512
  samples_to_save: 0
  chains_to_save: 0
  log_every_steps: 50
  number_chain_steps: 8
  final_model_samples_to_generate: 5000
  final_model_samples_to_save: 0
  final_model_chains_to_save: 0
  enable_progress_bar: true
  checkpoint_monitor: null
  checkpoint_save_top_k: 1
  checkpoint_save_last: true
  checkpoint_filename: "{epoch}"

model:
  type: discrete
  transition: marginal
  diffusion_steps: 500
  diffusion_noise_schedule: cosine
  guide_scale: 1.0
  hidden_size: 1024
  depth: 12
  num_heads: 16
  mlp_ratio: 4
  drop_condition: 0.01
  lambda_train: [1, 1, 1]
  ensure_connected: true

train:
  n_epochs: 400
  batch_size: 64
  lr: 2.0e-5
  clip_grad: 0.1
  num_workers: 0
  weight_decay: 1.0e-12
  seed: 0
  val_check_interval: null
  check_val_every_n_epoch: 10

dataset:
  data: molecule
  data_dir: ${oc.env:GRAPHFDM_DATA_ROOT}
  tokenizer_dir: ${oc.env:GRAPHFDM_ROOT}/assets/tokenizers/molecule
  pretrain_data_source: pretrain
  pin_memory: false

hydra:
  job:
    chdir: true
  run:
    dir: ${oc.env:GRAPHFDM_OUTPUT_ROOT}/molecule/pt
